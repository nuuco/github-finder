    <div class="app">
      <header class="header">
        <h1 class="header__title">GitHub Finder</h1>
        <p class="header__subtitle">GitHub 사용자 프로필과 최신 저장소를 조회합니다.</p>
      </header>

      <section class="search" aria-label="사용자 검색">
        <form class="search__form" id="search-form" novalidate>
          <label class="visually-hidden" for="username-input">GitHub 사용자명</label>
          <div class="search__field">
            <span class="search__icon" aria-hidden="true">
              <svg class="icon" width="16" height="16"><use href="#icon-search" /></svg>
            </span>
            <input
              id="username-input"
              class="search__input"
              type="text"
              name="username"
              autocomplete="username"
              placeholder="GitHub 로그인(정확히 일치)"
              spellcheck="false"
            />
            <button type="submit" class="search__button">검색</button>
          </div>
        </form>
      </section>

      <p
        class="status"
        id="status-message"
        role="status"
        aria-live="polite"
        data-variant="idle"
      ></p>

      <main class="main">
        <section
          class="panel profile-panel"
          id="profile-panel"
          aria-labelledby="profile-heading"
          data-state="empty"
        >
          <h2 id="profile-heading" class="visually-hidden">사용자 프로필</h2>
          <div class="profile">
            <div class="profile__avatar-wrap">
              <img
                id="profile-avatar"
                class="profile__avatar profile__avatar--placeholder"
                alt=""
                width="96"
                height="96"
                decoding="async"
              />
            </div>
            <div class="profile__meta">
              <p id="profile-name" class="profile__name profile__placeholder">—</p>
              <p id="profile-login" class="profile__login profile__placeholder" hidden></p>
              <p id="profile-bio" class="profile__bio" hidden></p>
              <p id="profile-inline-stats" class="profile-inline-stats" hidden aria-label="팔로워·팔로잉"></p>
              <div id="profile-actions" class="profile-actions" hidden>
                <a
                  id="profile-github-btn"
                  class="profile-github-btn"
                  href="#"
                  target="_blank"
                  rel="noopener noreferrer"
                  hidden
                >
                  <svg class="icon icon--inline" width="16" height="16" aria-hidden="true">
                    <use href="#icon-mark-github" />
                  </svg>
                  <span>GitHub에서 프로필 보기</span>
                </a>
              </div>
              <ul id="profile-vcard" class="profile-vcard" hidden></ul>
            </div>
          </div>
          <nav class="stats stats--github" id="stats-row" aria-label="공개 저장소·Gist" hidden>
            <span class="stats__item stats__item--static">
              <svg class="icon stats__icon" width="16" height="16" aria-hidden="true"><use href="#icon-repo" /></svg>
              <span id="stat-repos" class="stats__num">0</span>
              <span class="stats__lbl">저장소</span>
            </span>
            <span class="stats__sep" aria-hidden="true">·</span>
            <span class="stats__item stats__item--static">
              <svg class="icon stats__icon" width="16" height="16" aria-hidden="true"><use href="#icon-code-square" /></svg>
              <span id="stat-gists" class="stats__num">0</span>
              <span class="stats__lbl">Gist</span>
            </span>
          </nav>
        </section>

        <section class="panel repos-panel" aria-labelledby="repos-heading">
          <h2 id="repos-heading" class="repos__title">최신 저장소</h2>
          <ul class="repos" id="repo-list" data-state="empty"></ul>
        </section>
      </main>
    </div>

    <template id="repo-item-template">
      <li class="repos__item">
        <div class="repos__top">
          <svg class="icon repos__repo-icon" width="16" height="16" aria-hidden="true"><use href="#icon-repo" /></svg>
          <a class="repos__link" href="" target="_blank" rel="noopener noreferrer"></a>
          <span class="repos__fork-pill" hidden>포크</span>
        </div>
        <p class="repos__desc" hidden></p>
        <div class="repos__meta" aria-label="저장소 지표">
          <span class="repos__meta-item repos__lang-wrap" hidden>
            <span class="repos__lang-dot" aria-hidden="true"></span>
            <span class="repos__lang"></span>
          </span>
          <span class="repos__meta-item repos__stars">
            <svg class="icon" width="16" height="16" aria-hidden="true"><use href="#icon-star" /></svg>
            <span class="repos__stars-num"></span>
          </span>
          <span class="repos__meta-item repos__forks">
            <svg class="icon" width="16" height="16" aria-hidden="true"><use href="#icon-repo-forked" /></svg>
            <span class="repos__forks-num"></span>
          </span>
          <span class="repos__meta-item repos__pushed" hidden>
            <svg class="icon" width="16" height="16" aria-hidden="true"><use href="#icon-calendar" /></svg>
            <span class="repos__pushed-txt"></span>
          </span>
        </div>
      </li>
    </template>

    <script src="app.js" defer></script>
  </body>
</html>
